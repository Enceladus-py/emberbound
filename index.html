<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emberbound</title>
    <meta name="description" content="Emberbound - a pixel-art dragon action RPG that runs in your browser." />
    <link data-trunk rel="rust" data-bin="emberbound" data-wasm-opt="s"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <style>
      html, body { margin: 0; height: 100%; background: #12101a; overflow: hidden; }
      #frame { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        color: #f2a65a; font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div id="loading">KINDLING THE EMBERS...</div>
    <div id="frame"><canvas id="game" tabindex="0"></canvas></div>
    <script type="module">
      // Hide the loading text once the game has started drawing.
      const canvas = document.getElementById("game");
      const done = () => document.getElementById("loading")?.remove();
      new MutationObserver(done).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });
      canvas.focus();
      window.addEventListener("pointerdown", () => canvas.focus());
    </script>
  </body>
</html>
