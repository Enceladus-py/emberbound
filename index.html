<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#12101a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emberbound" />
    <title>Emberbound</title>
    <meta name="description" content="Emberbound - a pixel-art dragon action RPG that runs in your browser." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="rust" data-bin="emberbound" data-wasm-opt="s"
      data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #12101a; overflow: hidden;
        /* No scrolling, pinch zoom, text selection or tap highlight on phones. */
        touch-action: none; overscroll-behavior: none; user-select: none;
        -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #frame { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; image-rendering: pixelated; }
      .notice {
        position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
        color: #f2a65a; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
      }
      #loading { pointer-events: none; }
      #rotate { display: none; background: #12101a; z-index: 1; }
      #rotate span { display: block; margin-top: 12px; color: #a59fb8; font-size: 13px; letter-spacing: 0.1em; }
      /* The valley is wide: on a phone held upright, ask for landscape. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: grid; }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="notice">KINDLING THE EMBERS...</div>
    <div id="frame"><canvas id="game" tabindex="0"></canvas></div>
    <div id="rotate" class="notice"><div>TURN YOUR DEVICE SIDEWAYS<span>EMBERBOUND IS PLAYED IN LANDSCAPE</span></div></div>
    <script type="module">
      const canvas = document.getElementById("game");
      // Hide the loading text once the game has started drawing.
      const done = () => document.getElementById("loading")?.remove();
      new MutationObserver(done).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });
      canvas.focus();
      window.addEventListener("pointerdown", () => canvas.focus());

      // On phones, the first tap goes fullscreen and locks landscape where the
      // browser allows it (Android); elsewhere the rotate notice covers it.
      const coarse = window.matchMedia("(pointer: coarse)").matches;
      const immerse = async () => {
        const root = document.documentElement;
        try {
          if (!document.fullscreenElement && root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
          await screen.orientation?.lock?.("landscape");
        } catch (_) { /* Not supported here; the page works without it. */ }
      };
      if (coarse) window.addEventListener("pointerup", immerse, { once: true });
      // Long presses must not open the context menu over the game.
      window.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
