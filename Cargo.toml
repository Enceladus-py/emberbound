[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Bevy systems routinely take many parameters and nested query types.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui"] }
emberbound_domain = { path = "crates/domain" }
emberbound_pixelart = { path = "crates/pixelart" }
emberbound_core = { path = "crates/core" }
emberbound_world = { path = "crates/world" }
emberbound_combat = { path = "crates/combat" }
emberbound_monsters = { path = "crates/monsters" }
emberbound_ui = { path = "crates/ui" }

[package]
name = "emberbound"
description = "Emberbound - a pixel-art dragon action RPG for the web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
emberbound_domain.workspace = true
emberbound_core.workspace = true
emberbound_world.workspace = true
emberbound_combat.workspace = true
emberbound_monsters.workspace = true
emberbound_ui.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Already in the tree through Bevy; used to ask the browser about its pointer
# and to keep the best run in localStorage.
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "Storage"] }

[features]
# Debug keys for play-testing (see src/cheats.rs). Never enabled in releases.
cheats = []

# Fast iteration: optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

# Small, fast WebAssembly release build.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
